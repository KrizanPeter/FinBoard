<app-dashboard-summary-data class="col-12"></app-dashboard-summary-data>
<div class="row">
    <div class="col-12 col-md-4" *ngFor="let chart of dashboardChartInfo; let i = index">
        <app-dashboard-chart [chartInfo]="chart" [chartIndex]="i" [chartTotal]="dashboardChartInfo.length"
            (moveLeftEvent)="moveLeft($event)" (moveRightEvent)="moveRight($event)"
            (deleteEvent)="onChartDeleted($event)"></app-dashboard-chart>
    </div>
    <app-dashboard-view class="col-12 col-md-4"></app-dashboard-view>
</div>
