<nb-card class="overview-strip">
    <nb-card-body class="strip-body">
        <div style="text-align: center; padding: 1rem;" *ngIf="isLoading">
            <app-loading-spinner></app-loading-spinner>
        </div>

        <div class="strip-content" *ngIf="!isLoading">
            <!-- Total value tile -->
            <div class="total-tile">
                <span class="total-label">Portfolio</span>
                <span class="total-amount">{{ totalValue | number:'1.2-2' }} €</span>
                <a class="goals-link" *ngIf="hasAnyGoal" (click)="navigateToGoals()">
                    <nb-icon icon="flag-outline" pack="eva"></nb-icon> Goals
                </a>
            </div>

            <!-- Divider -->
            <div class="strip-divider"></div>

            <!-- Scrollable resource tiles -->
            <div class="tiles-scroll">
                <div class="resource-tile" *ngFor="let row of rows">
                    <div class="tile-top">
                        <span class="tile-name">{{ row.name }}</span>
                        <span class="group-badge" *ngIf="row.resourceType === 'group'">Group</span>
                    </div>
                    <div class="tile-mid">
                        <span class="tile-amount">{{ row.amount | number:'1.2-2' }} €</span>
                        <span class="tile-change" [ngClass]="row.isRising ? 'rising' : 'falling'"
                              *ngIf="row.resourceType !== 'group'">
                            <nb-icon [icon]="row.isRising ? 'arrow-upward-outline' : 'arrow-downward-outline'" pack="eva"></nb-icon>
                            {{ row.percentageMove | number:'1.1-1' }}%
                        </span>
                    </div>
                    <div class="tile-goal" *ngIf="row.goal">
                        <div class="goal-bar-track">
                            <div class="goal-bar-fill"
                                [style.width.%]="row.goal.percentageFulfilled"
                                [ngClass]="getProgressStatus(row.goal.percentageFulfilled)">
                            </div>
                        </div>
                        <span class="goal-label">
                            {{ row.goal.percentageFulfilled | number:'1.0-0' }}%
                            · {{ row.goal.remainingDays > 0 ? row.goal.remainingDays + 'd' : 'Overdue' }}
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </nb-card-body>
</nb-card>
